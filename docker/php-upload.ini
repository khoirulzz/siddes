upload_max_filesize=20M
post_max_size=22M
memory_limit=256M
max_execution_time=120

; === Mitigasi PHP2Shell (CVE-2026-109618 & CVE-2026-109619) ===
; Nonaktifkan session.upload_progress untuk menutup vektor UAF/stale global state
session.upload_progress.enabled=Off
; Batasi kedalaman serialisasi untuk mitigasi OOM crafted
max_input_nesting_level=64
; Pastikan error tidak di-expose ke output di production
display_errors=Off
display_startup_errors=Off
expose_php=Off
